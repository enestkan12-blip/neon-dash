name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Prepare Capacitor project
        run: |
          mkdir -p www/lib/examples/js
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/android@6 @capacitor/local-notifications@6 three@0.128.0
          npm i -D @capacitor/cli@6
          cp node_modules/three/build/three.min.js www/lib/
          cp -r node_modules/three/examples/js/shaders node_modules/three/examples/js/postprocessing www/lib/examples/js/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#lib/three.min.js#; s#https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/#lib/examples/js/#' www/index.html
          echo '{"appId":"com.neondash.game","appName":"Neon Dash","webDir":"www","backgroundColor":"#120a2e"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Dash build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
